<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Productivity Dashboard</h1>

    <!-- GOALS -->
    <section>
      <h2>Today's Goals</h2>
      <div style="margin-bottom: 12px">
        <input
          type="text"
          id="new-goal-input"
          placeholder="Write a new goal..."
        />
        <button id="add-goal-btn">Add Goal</button>
      </div>
      <ul id="goals-list"></ul>
    </section>

    <!-- HABITS -->
    <section>
      <h2>Habit Tracker</h2>

      <div style="margin-bottom: 14px">
        <input
          type="text"
          id="new-habit-input"
          placeholder="Enter a new habit..."
        />
        <button id="add-habit-btn">Add Habit</button>
      </div>

      <div id="habits"></div>

      <p id="progress-text">Progress: 0/4 completed</p>

      <div class="progress-bar-container">
        <div class="progress-bar" id="habits-progress-bar"></div>
      </div>

      <div id="habit-analytics" style="margin-top: 12px; font-size: 0.95rem">
        <p>Completed: <strong id="completed-count">0</strong></p>
        <p>Remaining: <strong id="remaining-count">4</strong></p>
        <p id="habit-message" style="margin-top: 8px; font-weight: 500">
          Let's get started 🚀
        </p>
      </div>

      <button id="reset-habits-btn">Reset Today's Habits</button>
    </section>

    <!-- CODING -->
    <section>
      <h2>Daily Coding</h2>
      <p>Goal: <strong id="goal-minutes">60</strong> minutes</p>
      <p>
        Today:
        <input
          type="number"
          id="today-input"
          value="0"
          min="0"
          style="width: 70px"
        />
        minutes
      </p>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <p id="goal-status">Not completed yet</p>
    </section>

    <!-- NOTES -->
    <section>
      <h2>Notes</h2>
      <textarea
        id="notes"
        rows="4"
        placeholder="What did I learn today?"
      ></textarea>
    </section>

    <!-- FOOTER -->
    <section>
      <p style="margin: 0; color: #71717a; font-size: 0.9rem">
        Day 10 · September 12, 2026 · MRR: $0
      </p>
    </section>

    <script src="script.js"></script>
  </body>
</html>
