<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 1 - Productivity Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Personal Productivity Dashboard</h1>

    <section>
      <h2>Today's Goals</h2>
      <ul id="goals-list"></ul>
    </section>

    <section>
      <h2>Habit Tracker</h2>
      <div id="habits">
        <label> <input type="checkbox" id="habit-english" /> English </label>
        <br />
        <label> <input type="checkbox" id="habit-coding" /> Coding </label>
        <br />
        <label> <input type="checkbox" id="habit-reading" /> Reading </label>
        <br />
        <label> <input type="checkbox" id="habit-exercise" /> Exercise </label>
      </div>
    </section>

    <section>
      <h2>Challenge</h2>
      <p>Day 1</p>
      <p>September 1, 2026</p>
      <p>MRR: $0</p>
    </section>

    <section>
      <h2>Notes</h2>
      <textarea
        id="notes"
        rows="4"
        placeholder="What did I learn today?"
      ></textarea>
    </section>

    <script src="script.js"></script>
  </body>
</html>
